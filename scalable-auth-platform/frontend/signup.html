<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — Scalable Auth Platform</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="container">
    <nav class="top"><a href="/">← Home</a><a href="/login.html">Login</a></nav>
    <div class="card">
      <h1>Sign Up</h1>
      <form id="signup-form">
        <label for="name">Name</label>
        <input id="name" type="text" required autocomplete="name" />
        <label for="email">Email</label>
        <input id="email" type="email" required autocomplete="email" />
        <label for="password">Password</label>
        <input id="password" type="password" required minlength="6" autocomplete="new-password" />
        <label for="confirm">Confirm Password</label>
        <input id="confirm" type="password" required autocomplete="new-password" />
        <button class="btn" type="submit">Create account</button>
      </form>
      <div id="msg" class="msg"></div>
    </div>
  </div>
  <script src="/js/auth.js"></script>
  <script>
    if (getToken()) window.location.href = "/dashboard.html";
    document.getElementById("signup-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      await signup(
        document.getElementById("name").value,
        document.getElementById("email").value,
        document.getElementById("password").value,
        document.getElementById("confirm").value
      );
    });
  </script>
</body>
</html>
