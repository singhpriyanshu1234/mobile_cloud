<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile — Scalable Auth Platform</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="container">
    <nav class="top"><a href="/dashboard.html">← Dashboard</a><a href="#" id="logout-link">Logout</a></nav>
    <div class="card">
      <h1>Profile</h1>
      <dl class="kv">
        <dt>Name</dt><dd id="f-name">…</dd>
        <dt>Email</dt><dd id="f-email">…</dd>
      </dl>
      <form id="profile-form">
        <label for="name">Update name</label>
        <input id="name" type="text" required maxlength="100" />
        <button class="btn" type="submit">Save</button>
      </form>
      <hr style="border-color:#334155;margin:24px 0" />
      <h1 style="font-size:20px">Danger zone</h1>
      <p class="muted">Delete your account permanently.</p>
      <button class="btn danger" id="delete-btn">Delete account</button>
      <div id="msg" class="msg"></div>
    </div>
  </div>
  <script src="/js/auth.js"></script>
  <script src="/js/profile.js"></script>
</body>
</html>
