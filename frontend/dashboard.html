<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Scalable Auth Platform</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="container">
    <nav class="top"><strong>Dashboard</strong><a href="#" id="logout-link">Logout</a></nav>
    <div class="card">
      <h1 id="welcome">Welcome</h1>
      <dl class="kv">
        <dt>User ID</dt><dd id="f-id">…</dd>
        <dt>Email</dt><dd id="f-email">…</dd>
        <dt>Created</dt><dd id="f-created">…</dd>
        <dt>Auth status</dt><dd id="f-auth">…</dd>
      </dl>
      <div class="row">
        <a class="btn secondary" href="/profile.html">Profile</a>
        <button class="btn danger" id="logout-btn">Logout</button>
      </div>
      <div id="msg" class="msg"></div>
    </div>
    <div class="card">
      <h1 style="font-size:20px">System health</h1>
      <div class="status">
        <span>API: <span id="api-status" class="pill">checking…</span></span>
        <span>DB: <span id="db-status" class="pill">checking…</span></span>
      </div>
    </div>
  </div>
  <script src="/js/auth.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
